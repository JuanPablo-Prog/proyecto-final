name: flutter_application_1
description: "Agencia de turismo - proyecto de Desarrollo Móvil (Flutter + Firebase)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  circular_menu: ^4.0.0

  # Estado (obligatorio: Provider; sin setState ni ValueNotifier)
  provider: ^6.1.5

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.0.0
  firebase_messaging: ^16.0.0

  # Persistencia / caché / UI
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  intl: ^0.20.2

  # Sensor + mapa nativo (se dibuja con el motor de Flutter, sin WebView)
  sensors_plus: ^6.1.1
  flutter_map: ^8.2.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - resources/

  # Tipografía personalizada (Poppins, incluida en resources/fonts)
  fonts:
    - family: Poppins
      fonts:
        - asset: resources/fonts/Poppins-Regular.ttf
        - asset: resources/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: resources/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: resources/fonts/Poppins-Bold.ttf
          weight: 700
